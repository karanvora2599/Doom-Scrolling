<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYT Best Sellers</title>
  </head>
  <body>

    <!-- Loading screen -->
    <div id="loading-screen">
      <div id="loading-content">
        <div id="loading-spinner"></div>
        <p id="loading-message">Loading…</p>
      </div>
    </div>

    <!-- Book popup -->
    <div id="book-popup" style="display:none">
      <div id="popup-overlay"></div>
      <div id="popup-card">
        <button id="popup-close" aria-label="Close">&times;</button>
        <div id="popup-content">
          <div id="popup-cover-side">
            <img id="popup-cover-img" src="" alt="" />
          </div>
          <div id="popup-info-side">
            <div id="popup-badge">
              <span class="badge-hash">#</span><span id="popup-rank-num"></span>
              <span class="badge-label">NYT Best Seller</span>
            </div>
            <h2 id="popup-title"></h2>
            <p id="popup-author"></p>
            <div id="popup-meta">
              <span id="popup-publisher"></span>
              <span id="popup-weeks"></span>
            </div>
            <p id="popup-description"></p>
            <a id="popup-amazon-link" href="" target="_blank" rel="noreferrer">
              Buy on Amazon &rarr;
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Main UI -->
    <div
      id="app"
      class="h-[100dvh] text-amber-50/60 flex flex-col justify-between relative z-10"
    >
      <!-- Centered logo -->
      <div class="absolute top-[2.5vmax] left-1/2 -translate-x-1/2 pointer-events-none z-20">
        <img src="/image.png" alt="Doom Scrolling" id="site-logo" />
      </div>

      <header class="p-[3vmax] grid grid-cols-12 text-[max(.5em,.7vmax)]">
        <div class="col-start-1 col-end-3">
          <p>New York Times</p>
          <p>Best Sellers</p>
        </div>
        <div class="col-start-5 col-end-7">
          <p>Hardcover Fiction</p>
          <p>Weekly List</p>
        </div>
        <div class="col-start-9 col-end-11">
          <p>Scroll to browse</p>
          <p>Click to learn more</p>
        </div>
        <div class="col-end-13 justify-self-end text-right">
          <p id="list-date"></p>
          <p>2025</p>
        </div>
      </header>

      <footer class="p-[3vmax] grid grid-cols-12 items-end text-[max(.5em,.7vmax)]">
        <div class="col-start-1 col-end-3 opacity-40">Books</div>
        <div id="book-strip" class="col-start-4 col-end-13 text-right">
          <p id="book-strip-rank" class="opacity-50 mb-1"></p>
          <p id="book-strip-title" class="text-[max(.9em,1.1vmax)] text-amber-50/80"></p>
        </div>
      </footer>
    </div>

    <canvas id="webgl"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
